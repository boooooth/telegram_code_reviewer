[project]
name = "reviewbot"
version = "0.1.0"
description = "Telegram bot that reviews code, built on a LangGraph harness with tiered memory and Langfuse LLM-ops"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain>=1.0",
    "langchain-anthropic>=1.4",
    "langchain-openai>=1.3",
    "langchain-google-genai>=4.2",
    "langchain-deepseek>=1.1",
    "langchain-ollama>=1.1",
    "python-telegram-bot>=22.5",
    "chromadb>=0.5",
    "httpx>=0.27",
    "langfuse>=4.13",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
